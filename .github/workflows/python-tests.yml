name: Research continuity reference checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public example
        uses: actions/checkout@v4
      - name: Execute synthetic research scenario
        run: python3 examples/research_demo.py
      - name: Run standard-library tests
        run: python3 -m unittest discover -s tests -v
